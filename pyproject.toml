[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "qcore"
version = "0.1.0"
description = "The Quantova post quantum client core for Python, generated over the Rust core QCore.rs, with quantum safe ML-DSA-65 signing and the Quantova gateway wire"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "Apache-2.0 OR MIT" }
keywords = ["post-quantum", "quantum-resistant", "blockchain", "wallet", "cryptography", "ml-dsa", "quantova", "pyo3"]

[tool.maturin]
python-source = "python"
module-name = "qcore._native"
features = ["pyo3/extension-module"]
