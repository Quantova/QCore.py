name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: QCore.py
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: Quantova/QCore.rs
          ref: 51fc6f93554be10ed9f32f7a5c268e3e5bacc672
          path: QCore.rs
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: Quantova/Quantova-Chain
          ref: 75ff886b0965bf0dfbc3c8378b7e6fccebc711ee
          path: Quantova-Chain
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: Quantova/QVM
          ref: 31b9d0e3ff92a3c715936b9293911b4e35529e47
          path: QVM
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.x'
      - name: fmt
        working-directory: QCore.py
        run: cargo fmt --all -- --check
      - name: clippy
        working-directory: QCore.py
        run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - name: build and test
        working-directory: QCore.py
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install --upgrade pip maturin pytest
          maturin develop --release --locked
          python test_conformance.py
          python test_payable_conformance.py
          python test_sign_validate.py
          python test_fee_cap.py
