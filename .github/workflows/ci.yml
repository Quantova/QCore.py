name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: QCore.py
          persist-credentials: false
      - name: resolve cross repo pins
        id: pins
        shell: bash
        run: |
          set -euo pipefail
          pin() { awk -v k="$1" '$1==k{print $2}' QCore.py/cross-repo-pins; }
          for k in Q-Crypto Quantova-Chain QVM QRC-CONSENSUS QCore.rs; do
            v=$(pin "$k")
            case "$v" in
              *[!0-9a-f]* | "") echo "cross-repo-pins $k is not a commit: '$v'" >&2; exit 1 ;;
            esac
            if [ "${#v}" -ne 40 ]; then
              echo "cross-repo-pins $k must name a full commit, not '$v'" >&2; exit 1
            fi
          done
          for k in Q-Crypto Quantova-Chain QVM QRC-CONSENSUS; do
            locked=$(grep -oE "$k\\.git\\?rev=[0-9a-f]{40}" QCore.py/Cargo.lock | sed "s/.*rev=//" | sort -u)
            if [ "$locked" != "$(pin "$k")" ]; then
              echo "Cargo.lock $k does not match the pinned $(pin "$k")" >&2
              echo "$locked" >&2
              exit 1
            fi
          done
          echo "qcore_rs=$(pin QCore.rs)" >> "$GITHUB_OUTPUT"
          echo "quantova_chain=$(pin Quantova-Chain)" >> "$GITHUB_OUTPUT"
          echo "qvm=$(pin QVM)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Quantova/QCore.rs
          ref: ${{ steps.pins.outputs.qcore_rs }}
          path: QCore.rs
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Quantova/Quantova-Chain
          ref: ${{ steps.pins.outputs.quantova_chain }}
          path: Quantova-Chain
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Quantova/QVM
          ref: ${{ steps.pins.outputs.qvm }}
          path: QVM
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.x'
      - name: fmt
        working-directory: QCore.py
        run: cargo fmt --all -- --check
      - name: clippy
        working-directory: QCore.py
        run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - name: build and test
        working-directory: QCore.py
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install pip==26.2.1 maturin==1.15.0 pytest==9.1.1
          maturin develop --release --locked
          python test_conformance.py
          python test_payable_conformance.py
          python test_sign_validate.py
          python test_fee_cap.py
          python test_network.py
          python test_nonce_validate.py
          python test_payable.py
          python test_register.py
          python test_seed_scratch.py
          python test_slow_read.py
          python test_transport.py
      - name: deny
        working-directory: QCore.py
        run: |
          cargo install --locked cargo-deny --version 0.19.9
          cargo deny check bans licenses sources advisories
