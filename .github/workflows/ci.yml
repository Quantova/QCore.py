name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: QCore.py
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Quantova/QCore.rs
          ref: 22f1603fb3ac23e89401402822eee93c701b1645
          path: QCore.rs
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Quantova/Quantova-Chain
          ref: fcd2eaf4fbb288519cc58b00a6bc1398033e584a
          path: Quantova-Chain
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Quantova/QVM
          ref: faf4870915c3419fa5e350e3257bfffd1074fe1f
          path: QVM
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.x'
      - name: fmt
        working-directory: QCore.py
        run: cargo fmt --all -- --check
      - name: clippy
        working-directory: QCore.py
        run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - name: build and test
        working-directory: QCore.py
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install --upgrade pip maturin pytest
          maturin develop --release --locked
          python test_conformance.py
          python test_payable_conformance.py
          python test_sign_validate.py
          python test_fee_cap.py
          python test_network.py
          python test_nonce_validate.py
          python test_payable.py
          python test_register.py
          python test_seed_scratch.py
          python test_slow_read.py
          python test_transport.py
      - name: deny
        working-directory: QCore.py
        run: |
          cargo install --locked cargo-deny --version 0.16.4
          cargo deny check bans licenses sources advisories
