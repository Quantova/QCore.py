name: ci
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  ci:
    uses: Quantova/Quantova-Ci/.github/workflows/rust-ci.yml@d749dfc210db85b58033507c1464f08c01cba30e  # main @ 2026-08-01
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.x'
      - run: python -m pip install --upgrade pip maturin pytest
      - run: maturin develop --release --locked
      - run: python -m pytest test_conformance.py test_payable_conformance.py test_sign_validate.py test_fee_cap.py -q
