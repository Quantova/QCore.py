name: publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheels:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, target: x86_64 }
          - { runner: ubuntu-latest, target: aarch64 }
          - { runner: macos-latest, target: x86_64 }
          - { runner: macos-latest, target: aarch64 }
          - { runner: windows-latest, target: x64 }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: QCore.py
          persist-credentials: false
      - name: resolve cross repo pins
        id: pins
        shell: bash
        run: |
          pin() { awk -v k="$1" '$1==k{print $2}' QCore.py/cross-repo-pins; }
          for k in QCore.rs Quantova-Chain QVM; do
            v=$(pin "$k")
            case "$v" in
              [0-9a-f]*) : ;;
              *) echo "cross-repo-pins is missing a commit for $k" >&2; exit 1 ;;
            esac
          done
          lock_qc=$(grep -oE "Q-Crypto\\.git\\?rev=[0-9a-f]+" QCore.py/Cargo.lock | head -1 | sed "s/.*rev=//")
          pins_qc=$(pin Q-Crypto)
          if [ -n "$lock_qc" ] && [ "$lock_qc" != "$pins_qc" ]; then
            echo "cross-repo-pins Q-Crypto $pins_qc disagrees with Cargo.lock $lock_qc" >&2; exit 1
          fi
          echo "qcore_rs=$(pin QCore.rs)" >> "$GITHUB_OUTPUT"
          echo "quantova_chain=$(pin Quantova-Chain)" >> "$GITHUB_OUTPUT"
          echo "qvm=$(pin QVM)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Quantova/QCore.rs
          ref: ${{ steps.pins.outputs.qcore_rs }}
          path: QCore.rs
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Quantova/Quantova-Chain
          ref: ${{ steps.pins.outputs.quantova_chain }}
          path: Quantova-Chain
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Quantova/QVM
          ref: ${{ steps.pins.outputs.qvm }}
          path: QVM
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.x'
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b
        with:
          working-directory: QCore.py
          target: ${{ matrix.target }}
          args: --release --out dist --locked
          manylinux: auto
          sccache: 'true'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wheels-${{ matrix.runner }}-${{ matrix.target }}
          path: QCore.py/dist

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: QCore.py
          persist-credentials: false
      - name: resolve cross repo pins
        id: pins
        shell: bash
        run: |
          pin() { awk -v k="$1" '$1==k{print $2}' QCore.py/cross-repo-pins; }
          for k in QCore.rs Quantova-Chain QVM; do
            v=$(pin "$k")
            case "$v" in
              [0-9a-f]*) : ;;
              *) echo "cross-repo-pins is missing a commit for $k" >&2; exit 1 ;;
            esac
          done
          lock_qc=$(grep -oE "Q-Crypto\\.git\\?rev=[0-9a-f]+" QCore.py/Cargo.lock | head -1 | sed "s/.*rev=//")
          pins_qc=$(pin Q-Crypto)
          if [ -n "$lock_qc" ] && [ "$lock_qc" != "$pins_qc" ]; then
            echo "cross-repo-pins Q-Crypto $pins_qc disagrees with Cargo.lock $lock_qc" >&2; exit 1
          fi
          echo "qcore_rs=$(pin QCore.rs)" >> "$GITHUB_OUTPUT"
          echo "quantova_chain=$(pin Quantova-Chain)" >> "$GITHUB_OUTPUT"
          echo "qvm=$(pin QVM)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Quantova/QCore.rs
          ref: ${{ steps.pins.outputs.qcore_rs }}
          path: QCore.rs
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Quantova/Quantova-Chain
          ref: ${{ steps.pins.outputs.quantova_chain }}
          path: Quantova-Chain
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Quantova/QVM
          ref: ${{ steps.pins.outputs.qvm }}
          path: QVM
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.x'
      - name: build and test the pinned source
        working-directory: QCore.py
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install --upgrade pip maturin
          maturin develop --release --locked
          python test_conformance.py
          python test_payable_conformance.py
          python test_sign_validate.py
          python test_fee_cap.py
          python test_network.py
          python test_nonce_validate.py
          python test_payable.py
          python test_register.py
          python test_seed_scratch.py
          python test_slow_read.py
          python test_transport.py

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: QCore.py
          persist-credentials: false
      - name: resolve cross repo pins
        id: pins
        shell: bash
        run: |
          pin() { awk -v k="$1" '$1==k{print $2}' QCore.py/cross-repo-pins; }
          for k in QCore.rs Quantova-Chain QVM; do
            v=$(pin "$k")
            case "$v" in
              [0-9a-f]*) : ;;
              *) echo "cross-repo-pins is missing a commit for $k" >&2; exit 1 ;;
            esac
          done
          lock_qc=$(grep -oE "Q-Crypto\\.git\\?rev=[0-9a-f]+" QCore.py/Cargo.lock | head -1 | sed "s/.*rev=//")
          pins_qc=$(pin Q-Crypto)
          if [ -n "$lock_qc" ] && [ "$lock_qc" != "$pins_qc" ]; then
            echo "cross-repo-pins Q-Crypto $pins_qc disagrees with Cargo.lock $lock_qc" >&2; exit 1
          fi
          echo "qcore_rs=$(pin QCore.rs)" >> "$GITHUB_OUTPUT"
          echo "quantova_chain=$(pin Quantova-Chain)" >> "$GITHUB_OUTPUT"
          echo "qvm=$(pin QVM)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Quantova/QCore.rs
          ref: ${{ steps.pins.outputs.qcore_rs }}
          path: QCore.rs
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Quantova/Quantova-Chain
          ref: ${{ steps.pins.outputs.quantova_chain }}
          path: Quantova-Chain
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Quantova/QVM
          ref: ${{ steps.pins.outputs.qvm }}
          path: QVM
          persist-credentials: false
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b
        with:
          working-directory: QCore.py
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wheels-sdist
          path: QCore.py/dist

  publish:
    needs: [test, wheels, sdist]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
