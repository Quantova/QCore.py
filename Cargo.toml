[package]
name = "qcore-python"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR MIT"
description = "The Python binding for the Quantova client core, generated over QCore with pyo3."
repository = "https://github.com/Quantova/QCore.py"

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
qcore = { path = "../QCore.rs", default-features = false }
qtv-account = { path = "../Quantova-Chain/crates/qtv-account" }
qtv-tx = { path = "../Quantova-Chain/crates/qtv-tx" }
qtv-codec = { path = "../Quantova-Chain/crates/qtv-codec" }
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py38"] }
qtv-wipe = { path = "../Quantova-Chain/crates/qtv-wipe" }
