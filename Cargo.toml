[package]
name = "qcore-python"
version = "0.6.0"
edition = "2021"
license = "Apache-2.0 OR MIT"
description = "The Python binding for the Quantova client core, generated over QCore with pyo3."
repository = "https://github.com/Quantova/QCore.py"

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
qcore = { path = "../QCore.rs", default-features = false }
qtv-tx = { git = "https://github.com/Quantova/Quantova-Chain.git", rev = "c6697ba56d86316d8c3d5968fbe6b5ab3ad1df04" }
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py38"] }
qtv-wipe = { git = "https://github.com/Quantova/Quantova-Chain.git", rev = "c6697ba56d86316d8c3d5968fbe6b5ab3ad1df04" }
