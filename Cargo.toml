[package]
name = "qcore-python"
version = "0.11.7"
edition = "2021"
license = "Apache-2.0 OR MIT"
description = "The Python binding for the Quantova client core, generated over QCore with pyo3."
repository = "https://github.com/Quantova/QCore.py"

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
qcore = { path = "../QCore.rs", default-features = false }
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py38"] }
qtv-wipe = { git = "https://github.com/Quantova/Quantova-Chain.git", rev = "e349230bdd653f7436964a3c6de65af367d638be" }

[profile.release]
overflow-checks = true
